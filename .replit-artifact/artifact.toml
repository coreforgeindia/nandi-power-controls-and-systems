kind = "web"
previewPath = "/"
title = "Nandi Power Controls and Systems"
version = "1.0.0"
id = "artifacts/nandi-power"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23139

[services.development]
run = "pnpm --filter @workspace/nandi-power run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nandi-power", "run", "build" ]
publicDir = "artifacts/nandi-power/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23139"
BASE_PATH = "/"
